ver: 13.1.0
tarball_loc: /root/grafana-{{ ver }}.tar.gz
service_name: grafana
install_base: /opt
install_dir: "{{ install_base }}/grafana-{{ ver }}"
smtp_host: ""
smtp_user: ""
smtp_pass: ""
smtp_from_address: ""
smtp_from_name: ""
# the following settings are useful if you want to run two grafana
# instances on one server
data_dir: /var/lib/{{ service_name }}
log_dir: /var/log/{{ service_name }}
config_dir: /etc/{{ service_name }}
provisioning_dir: "{{ config_dir }}/provisioning"
http_port: 3000
# empty binds all interfaces, which is the Grafana default. Set to 127.0.0.1
# when Grafana is only reached through a reverse proxy on the same host.
http_addr: ""

# Data sources written to the provisioning directory, so what exists is
# described here rather than clicked into the UI. A provisioned data source
# cannot be edited in the UI. Each entry takes name, type, url, and optionally
# is_default and json_data:
#
#   datasources:
#     - name: VictoriaMetrics
#       type: prometheus
#       url: http://localhost:8428
#       is_default: true
#
datasources: []
# nightly restart timer, opt-in per host -- 04:00 UTC is midnight EDT
# (servers run in UTC)
restart_timer: false
restart_oncalendar: "*-*-* 04:00:00"
