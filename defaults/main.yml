ver: 13.2.4
tarball_loc: /root/grafana-{{ ver }}.tar.gz
service_name: grafana
install_base: /opt
install_dir: "{{ install_base }}/grafana-{{ ver }}"
smtp_host: ""
smtp_user: ""
smtp_pass: ""
smtp_from_address: ""
smtp_from_name: ""
# the following settings are useful if you want to run two grafana
# instances on one server
data_dir: /var/lib/{{ service_name }}
log_dir: /var/log/{{ service_name }}
config_dir: /etc/{{ service_name }}
provisioning_dir: "{{ config_dir }}/provisioning"
http_port: 3000
# empty binds all interfaces, which is the Grafana default. Set to 127.0.0.1
# when Grafana is only reached through a reverse proxy on the same host.
http_addr: ""

# Memory ceilings for the service, in megabytes. memory_high_mb sets systemd's
# MemoryHigh: above it the kernel reclaims Grafana's memory and slows its
# allocations, but does not kill it. memory_max_mb sets MemoryMax, the hard
# ceiling at which it is killed. GOMEMLIMIT is set to 80% of the lower of the
# two, so the Go garbage collector works harder before either is reached. 0
# leaves a setting unset.
memory_high_mb: 0
memory_max_mb: 0

# Data sources written to the provisioning directory, so what exists is
# described here rather than clicked into the UI. A provisioned data source
# cannot be edited in the UI. Each entry takes name, type, url, and optionally
# is_default and json_data:
#
#   datasources:
#     - name: VictoriaMetrics
#       type: prometheus
#       url: http://localhost:8428
#       is_default: true
#
datasources: []

# Dashboards. dashboards_src is a directory in the playbook repo holding
# dashboard JSON files; they are installed to dashboards_dir and a provider is
# written to the provisioning directory so Grafana imports them on start and
# reapplies them on each poll. Leave "" to manage dashboards in the UI.
dashboards_src: ""
dashboards_dir: "{{ config_dir }}/dashboards"
# The imported copy is authoritative, so a restart returns a dashboard to what
# the repo says. Edits are still allowed in the UI, which is how you work out
# what to commit next.
dashboards_allow_ui_updates: true
dashboards_poll_seconds: 30

# restart timer, opt-in per host -- every 6 hours starting at 04:00 UTC,
# which is midnight EDT (servers run in UTC)
restart_timer: false
restart_oncalendar: "*-*-* 04,10,16,22:00:00"
