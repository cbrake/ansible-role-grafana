- name: create install dir
  file:
    path: "{{ install_base }}"
    state: directory

- name: create grafana group
  group:
    name: grafana
    state: present

- name: create grafana user
  user:
    name: grafana
    group: grafana
    createhome: false

- name: fetch grafana
  get_url:
    url: https://dl.grafana.com/oss/release/grafana-{{ ver }}.linux-amd64.tar.gz
    dest: "{{ tarball_loc }}"
  register: fetch

- name: extract grafana
  unarchive:
    src: "{{ tarball_loc }}"
    dest: "{{ install_base }}"
    copy: no
    owner: grafana
    group: grafana
  when: fetch.changed
  notify: restart grafana

- name: create dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
  with_items:
    - "{{ log_dir }}"
    - "{{ data_dir }}"
    - "{{ data_dir}}/plugins"
    - "{{ config_dir}}"
    - "{{ provisioning_dir }}"
    - "{{ provisioning_dir }}/datasources"
    - "{{ provisioning_dir }}/dashboards"

- name: provision grafana data sources
  template:
    src: datasources.yaml.j2
    dest: "{{ provisioning_dir }}/datasources/ansible.yaml"
    owner: grafana
    mode: "0640"
  when: datasources | length > 0
  notify: restart grafana

- name: grafana service file
  template:
    src=grafana.service.j2 dest=/etc/systemd/system/{{ service_name }}.service
  notify:
    - reload systemd grafana
    - restart grafana

- name: grafana config
  template: src=grafana.ini.j2 dest={{ config_dir }}/grafana.ini owner=grafana
  notify: restart grafana

- name: start grafana
  service: name={{ service_name }} state=started enabled=yes

- name: grafana nightly restart units
  template:
    src: "grafana-restart.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ service_name }}-restart.{{ item }}"
  with_items:
    - service
    - timer
  when: restart_timer
  notify: reload systemd grafana

- name: flush handlers so the restart timer sees current units
  meta: flush_handlers

- name: enable grafana nightly restart timer
  systemd:
    name: "{{ service_name }}-restart.timer"
    state: started
    enabled: yes
  when: restart_timer

- name: remove grafana nightly restart timer
  when: not restart_timer
  block:
    - name: stop grafana nightly restart timer
      systemd:
        name: "{{ service_name }}-restart.timer"
        state: stopped
        enabled: no
      failed_when: false

    - name: delete grafana nightly restart units
      file:
        path: "/etc/systemd/system/{{ service_name }}-restart.{{ item }}"
        state: absent
      with_items:
        - service
        - timer
      notify: reload systemd grafana


