- name: create install dir
  file:
    path: "{{ install_base }}"
    state: directory

- name: create grafana group
  group:
    name: grafana
    state: present

- name: create grafana user
  user:
    name: grafana
    group: grafana
    createhome: false

- name: look for a cached grafana release
  stat:
    path: "{{ tarball_loc }}"
  register: grafana_cached

# get_url makes a conditional request even when the destination exists, and that
# request fails the play when the release host is unavailable, so skip the task
# outright once the tarball for this version is on disk. The retries cover a
# connection dropped while actually downloading.
- name: fetch grafana
  get_url:
    url: https://dl.grafana.com/oss/release/grafana-{{ ver }}.linux-amd64.tar.gz
    dest: "{{ tarball_loc }}"
  when: not grafana_cached.stat.exists
  register: fetch
  until: fetch is succeeded
  retries: 3
  delay: 5

# Guarded on the extracted binary rather than on the fetch reporting a change,
# so a tarball that is already cached but not yet unpacked still gets unpacked.
- name: extract grafana
  unarchive:
    src: "{{ tarball_loc }}"
    dest: "{{ install_base }}"
    copy: no
    owner: grafana
    group: grafana
    creates: "{{ install_dir }}/bin/grafana"
  notify: restart grafana

- name: create dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
  with_items:
    - "{{ log_dir }}"
    - "{{ data_dir }}"
    - "{{ data_dir}}/plugins"
    - "{{ config_dir}}"
    - "{{ provisioning_dir }}"
    - "{{ provisioning_dir }}/datasources"
    - "{{ provisioning_dir }}/dashboards"

- name: provision grafana data sources
  template:
    src: datasources.yaml.j2
    dest: "{{ provisioning_dir }}/datasources/ansible.yaml"
    owner: grafana
    mode: "0640"
  when: datasources | length > 0
  notify: restart grafana

- name: create dashboard dir
  file:
    path: "{{ dashboards_dir }}"
    state: directory
    owner: grafana
    mode: "0755"
  when: dashboards_src != ""

- name: install dashboards
  copy:
    src: "{{ item }}"
    dest: "{{ dashboards_dir }}/{{ item | basename }}"
    owner: grafana
    mode: "0644"
  with_fileglob: "{{ dashboards_src }}/*.json"
  when: dashboards_src != ""
  notify: restart grafana

- name: list installed dashboards
  find:
    paths: "{{ dashboards_dir }}"
    patterns: ["*.json"]
  register: grafana_dashboards_installed
  when: dashboards_src != ""

# A dashboard removed from the repo is removed here, so the repo is the whole
# description of what Grafana shows.
- name: remove dashboards no longer in the repo
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_dashboards_installed.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - dashboards_src != ""
    - item.path | basename not in (query('fileglob', dashboards_src + '/*.json')
      | map('basename') | list)
  notify: restart grafana

- name: provision dashboard provider
  template:
    src: dashboards.yaml.j2
    dest: "{{ provisioning_dir }}/dashboards/ansible.yaml"
    owner: grafana
    mode: "0640"
  when: dashboards_src != ""
  notify: restart grafana

- name: grafana service file
  template:
    src=grafana.service.j2 dest=/etc/systemd/system/{{ service_name }}.service
  notify:
    - reload systemd grafana
    - restart grafana

- name: grafana config
  template: src=grafana.ini.j2 dest={{ config_dir }}/grafana.ini owner=grafana
  notify: restart grafana

- name: start grafana
  service: name={{ service_name }} state=started enabled=yes

- name: grafana restart units
  template:
    src: "grafana-restart.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ service_name }}-restart.{{ item }}"
  with_items:
    - service
    - timer
  when: restart_timer
  notify: reload systemd grafana

- name: flush handlers so the restart timer sees current units
  meta: flush_handlers

- name: enable grafana restart timer
  systemd:
    name: "{{ service_name }}-restart.timer"
    state: started
    enabled: yes
  when: restart_timer

- name: remove grafana restart timer
  when: not restart_timer
  block:
    - name: stop grafana restart timer
      systemd:
        name: "{{ service_name }}-restart.timer"
        state: stopped
        enabled: no
      failed_when: false

    - name: delete grafana restart units
      file:
        path: "/etc/systemd/system/{{ service_name }}-restart.{{ item }}"
        state: absent
      with_items:
        - service
        - timer
      notify: reload systemd grafana


